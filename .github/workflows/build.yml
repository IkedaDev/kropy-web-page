name: Build and Deploy Kropy Web Page

on:
  push:
    branches: ["main", "develop"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Usamos el tag dinámico por Short SHA y también 'latest' para facilidad en local
          tags: |
            ikedaharket/kropy-web-page:${{ steps.vars.outputs.sha_short }}
            ikedaharket/kropy-web-page:latest
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Flujo automático GitOps: Actualiza los manifiestos de tu repositorio ikedadev-infra
      - name: Update Infra Repo
        run: |
          TARGET_DIR=${{ github.ref_name == 'main' && 'tenants/kropy/prod/kropy-web-page/frontend' || 'tenants/kropy/qa/kropy-web-page/frontend' }}
          
          git config --global user.email "bot@ikedadev.com"
          git config --global user.name "IkedaDev Bot"
          
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/IkedaDev/ikedadev-infra
          cd ikedadev-infra
          
          # Entrar al directorio correspondiente (Créalo en tu repo si no existe aún)
          mkdir -p $TARGET_DIR
          cd $TARGET_DIR
          
          # Actualizar el archivo de despliegue (ej. deployment.yaml o docker-compose.yml) cambiando la imagen con el nuevo Short SHA
          # Nota: Modifica 'deployment.yaml' por el nombre del archivo de manifiesto real que uses allí
          if [ -f deployment.yaml ]; then
            sed -i "s|image: ikedaharket/kropy-web-page:.*|image: ikedaharket/kropy-web-page:${{ steps.vars.outputs.sha_short }}|g" deployment.yaml
            
            git add deployment.yaml
            git commit -m "chore(kropy): update frontend image to ${{ steps.vars.outputs.sha_short }} [skip ci]"
            git push origin main
          else
            echo "Aviso: No se encontró deployment.yaml en $TARGET_DIR para automatizar el reemplazo con sed."
          fi